name: Refresh quiz data

on:
  schedule:
    # 7 AM and 3 PM America/Chicago. Cron is UTC-only, so it fires at both the CST and CDT
    # offsets (12/13 and 20/21 UTC) and the gate job below lets only the one that is 7 or 15 local through.
    - cron: "0 12,13,20,21 * * *"
  workflow_dispatch:
    inputs:
      from:
        description: "First day YYYY-MM-DD (blank = today minus DAYS-1)"
        required: false
      to:
        description: "Last day YYYY-MM-DD (blank = today, America/Chicago)"
        required: false
  push:
    branches: [main]
    paths-ignore: ["data/**"]   # code/page changes redeploy; data commits deploy from the pull run below

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: data/meta.json
          sparse-checkout-cone-mode: false
      - id: check
        # GitHub often starts scheduled runs hours late, so don't gate on the current hour.
        # Instead: run if the last pull predates the most recent 7 AM / 3 PM Chicago slot.
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, datetime as dt, sys
          from zoneinfo import ZoneInfo
          tz = ZoneInfo("America/Chicago")
          now = dt.datetime.now(tz)
          slots = [dt.datetime.combine(now.date() - dt.timedelta(days=d), dt.time(h), tz) for d in (0, 1) for h in (15, 7)]
          slot = max(s for s in slots if s <= now)
          try:
              pulled = dt.datetime.fromisoformat(json.load(open("data/meta.json"))["pulled_at"].replace("Z", "+00:00"))
          except Exception:
              pulled = None
          due = pulled is None or pulled < slot
          print(f"now={now:%Y-%m-%d %H:%M %Z} slot={slot:%Y-%m-%d %H:%M %Z} pulled={pulled} due={due}", file=sys.stderr)
          print(f"run={'true' if due else 'false'}")
          PY

  pull:
    needs: gate
    if: github.event_name != 'push' && needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull from Octane and reshape
        env:
          OCTANE_API_KEY: ${{ secrets.OCTANE_API_KEY }}
          QUIZ_NAME: ${{ vars.QUIZ_NAME }}
          QUIZ_ID: ${{ vars.QUIZ_ID }}
          DAYS: ${{ vars.DAYS }}
          TZ_NAME: ${{ vars.TZ_NAME }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
        run: python3 scripts/pull.py          # plaintext → build/ (never committed)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Encrypt for publishing
        env:
          DASHBOARD_KEY: ${{ secrets.DASHBOARD_KEY }}
        run: node scripts/encrypt.mjs          # build/ → data/bundle.enc + data/meta.json {pulled_at}
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bundle.enc data/meta.json
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

  deploy:
    needs: pull
    if: always() && (needs.pull.result == 'success' || github.event_name == 'push')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main              # picks up the data commit the pull job just pushed
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html assets data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
